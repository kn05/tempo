name: CI & Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test tempo-core
        run: cargo test -p tempo-core

      - name: Self-test TickTick PoC script
        run: python3 scripts/ticktick_poc.py --self-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci || npm install
          npm run build

  build-windows:
    needs: core-and-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Test tempo-core (Windows native)
        run: cargo test -p tempo-core --target ${{ matrix.target }}

      - name: Build Tauri bundle (${{ matrix.label }})
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempo-windows-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
